name: docker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag (e.g. 0.1.1)"
        required: true
        default: "edge"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "building $V"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login Docker Hub
        if: env.DH_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USER }}
          password: ${{ env.DH_PASS }}

      - name: Tags (full)
        id: full
        run: |
          V="${{ steps.v.outputs.version }}"
          T="ghcr.io/${{ github.repository }}:$V
          ghcr.io/${{ github.repository }}:latest"
          if [ -n "$DH_USER" ]; then
            T="$T
          $DH_USER/lastcast:$V
          $DH_USER/lastcast:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$T"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Tags (slim)
        id: slim
        run: |
          V="${{ steps.v.outputs.version }}"
          T="ghcr.io/${{ github.repository }}:$V-slim
          ghcr.io/${{ github.repository }}:latest-slim"
          if [ -n "$DH_USER" ]; then
            T="$T
          $DH_USER/lastcast:$V-slim
          $DH_USER/lastcast:latest-slim"
          fi
          {
            echo "tags<<EOF"
            echo "$T"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push full
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MEDIA_TOOLS=1
            VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.full.outputs.tags }}

      - name: Build & push slim
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MEDIA_TOOLS=0
            VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.slim.outputs.tags }}
